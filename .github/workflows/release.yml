name: Build native preview releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            bundle: nsis
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundle: deb
          - os: macos-15
            platform: macos-aarch64
            bundle: dmg
          - os: macos-15-intel
            platform: macos-x86_64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config clang
      - run: npm ci
      - run: npm run test:cache-security
      - run: npm audit --audit-level=high
      - run: cargo test --locked
      - run: cargo test --locked -p ferxium-core --features yara-engine
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} --ci
      - run: node scripts/self-scan-smoke.mjs
      - if: runner.os == 'Linux'
        run: node scripts/supervisor-smoke.mjs
        env:
          FERXIUM_SERVICE_BINARY: target/release/ferxium-service
      - if: runner.os == 'Windows'
        run: ./scripts/windows-supervisor-smoke.ps1
        env:
          FERXIUM_SERVICE_BINARY: target/release/ferxium-service.exe
      - run: python scripts/collect-release.py
      - if: runner.os == 'macOS'
        run: |
          ferxium_mount="$RUNNER_TEMP/ferxium-dmg"
          mkdir -p "$ferxium_mount"
          hdiutil attach target/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$ferxium_mount"
          trap 'hdiutil detach "$ferxium_mount"' EXIT
          codesign --verify --deep --strict "$ferxium_mount/FerXium.app"
          otool -L "$ferxium_mount/FerXium.app/Contents/MacOS/ferxium-service"
          "$ferxium_mount/FerXium.app/Contents/MacOS/ferxium-cli" --help
          FERXIUM_SERVICE_BINARY="$ferxium_mount/FerXium.app/Contents/MacOS/ferxium-service" node scripts/service-smoke.mjs
          FERXIUM_SERVICE_BINARY="$ferxium_mount/FerXium.app/Contents/MacOS/ferxium-service" node scripts/supervisor-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FerXium $TAG" --prerelease --notes-file packaging/PREVIEW.md
