name: Build native preview releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            bundle: nsis
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundle: deb
          - os: macos-15
            platform: macos-aarch64
            bundle: dmg
          - os: macos-15-intel
            platform: macos-x86_64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config clang
      - run: npm ci
      - run: cargo test --locked
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} --ci
      - run: python scripts/collect-release.py
      - if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict target/release/bundle/macos/FerXium.app
          target/release/ferxium-cli --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FerXium $TAG" --prerelease --notes-file packaging/PREVIEW.md
